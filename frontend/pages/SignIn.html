<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Login</title>
  <link rel="stylesheet" href="../assets/css/SignInDesktop.css">
  <script src="../js/pages/SignIn.js" defer></script>
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(
      "ISI_SUPABASE_URL_KAMU",
      "ISI_SUPABASE_ANON_KEY_KAMU"
    );
  </script>
</head>
<body>

<div class="noise"></div>

<main class="container">

  <!-- KIRI -->
  <section class="left-panel">
    <h2 class="logo">!syaraku</h2>

    <div class="hero-text">
      <h1>Belajar SIBI,<br>tumbuh bersama.</h1>

      <p>
        Platform belajar inklusif dengan video, praktik kamera pintar,
        dan petualangan yang menyenangkan.
      </p>

      
    </div>

  </section>

  <!-- KANAN -->
  <section class="right-panel">
    
    <div class="login-wrapper">

      <div class="purple-top">
        <h2>Masuk ke !syaraku</h2>
        <p>Lanjutkan petualangan SIBI-mu!</p>
      </div>

      <div class="login-card">

        <label>Email</label>
        <input id="email" type="email" placeholder="@nio@email.com">

        <label>Kata Sandi</label>

        <div class="password-box">
          <input id="password" type="password" placeholder="••••••••">
          <button id="togglePassword" type="button">
            <img id= "eyeIcon" src="../assets/img/hide.png" alt="ShowPassword ">
          </button>
        </div>

        <a href="#" class="forgot">Lupa Kata Sandi?</a>

        <button class="login-btn">Masuk</button>

        <div class="register">
        Belum punya akun?
        <a href="SignUp.html">Daftar Sekarang</a>
        <br>
        Atau masuk dengan
      </div>

      <div class="login-options">
        <button id="googleBtn"  class="options-btn">
        <img src="../assets/img/search (1).png" alt="Daftar dengan Google">
      </button>
      </div>

      </div>

      

      
      

    </div>

  </section>

</main>


<script src="script.js"></script>
</body>
</html>
