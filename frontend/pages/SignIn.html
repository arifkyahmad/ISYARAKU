<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Login</title>
  <link rel="stylesheet" href="../assets/css/SignIn.css">
  <link rel="stylesheet" href="../js/pages/SignIn.js">
</head>
<body>

<div class="noise"></div>

<main class="container">

  <!-- KIRI -->
  <section class="left-panel">
    <h2 class="logo">!syaraku</h2>

    <div class="hero-text">
      <h1>Belajar SIBI,<br>tumbuh bersama.</h1>

      <p>
        Platform belajar inklusif dengan video, praktik kamera pintar,
        dan petualangan yang menyenangkan.
      </p>

      
    </div>

  </section>

  <!-- KANAN -->
  <section class="right-panel">
    
    <div class="login-wrapper">

      <div class="purple-top">
        <h2>Masuk ke !syaraku</h2>
        <p>Lanjutkan petualangan SIBI-mu!</p>
      </div>

      <div class="login-card">

        <label>Email</label>
        <input type="email" placeholder="@nio@email.com">

        <label>Kata Sandi</label>

        <div class="password-box">
          <input id="password" type="password" placeholder="••••••••">
          <button id="togglePassword" type="button">
            <img id= "eyeIcon" src="../assets/img/hide.png" alt="ShowPassword ">
          </button>
        </div>

        <a href="#" class="forgot">Lupa Kata Sandi?</a>

        <button class="login-btn">Masuk</button>

        <div class="register">
        Belum punya akun?
        <a href="SignUp.html">Daftar Sekarang</a>
        <br>
        Atau masuk dengan
      </div>

      <div class="login-options">
        <button class="options-btn">
        <img src="../assets/img/search (1).png" alt="">
      </button>
      </div>

      </div>

      

      
      

    </div>

  </section>

</main>


<script src="script.js"></script>
</body>
</html>



<script>
const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.src = "../assets/img/view.png"
        eyeIcon.alt = "Hide Password"
    }else{
        password.type = "password";
        eyeIcon.src = "../assets/img/hide.png"
        eyeIcon.alt = "Show Password"
    }

});

document.querySelector(".login-btn").addEventListener("click", () => {

    const email = document.querySelector("input[type=email]").value;
    const pass = password.value;

    if(email === "" || pass === ""){
        alert("Mohon isi email dan kata sandi.");
        return;
    }

    alert("Login berhasil (dummy).");

});
</script>
