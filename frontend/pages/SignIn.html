<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>

<main class="container">

  <!-- KIRI -->
  <section class="left-panel">
    <h2 class="logo">!syaraku</h2>

    <div class="hero-text">
      <h1>Belajar BISINDO,<br>tumbuh bersama.</h1>

      <p>
        Platform belajar inklusif dengan video, praktik kamera pintar,
        dan petualangan yang menyenangkan.
      </p>

      
    </div>

  </section>

  <!-- KANAN -->
  <section class="right-panel">
    
    <div class="login-wrapper">

      <div class="purple-top">
        <h2>Masuk ke !syaraku</h2>
        <p>Lanjutkan petualangan BISINDO-mu!</p>
      </div>

      <div class="login-card">

        <label>Email</label>
        <input type="email" placeholder="@nio@email.com">

        <label>Kata Sandi</label>

        <div class="password-box">
          <input id="password" type="password" placeholder="••••••••">
          <button id="togglePassword" type="button">
            <img id= "eyeIcon" src="img/hide.png" alt="ShowPassword ">
          </button>
        </div>

        <a href="#" class="forgot">Lupa Kata Sandi?</a>

        <button class="login-btn">Masuk</button>

        <div class="register">
        Belum punya akun?
        <a href="#">Daftar Sekarang</a>
        <br>
        Atau masuk dengan
      </div>

      <div class="login-options">
        <button class="options-btn">
        <img src="img/search (1).png" alt="">
      </button>
      </div>

      </div>

      

      
      

    </div>

  </section>

</main>


<script src="script.js"></script>
</body>
</html>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background: url(img/9dff1bedbea3a4ccf2cf5f75e10b1dc92ed49932.png);
    background-size: cover;
    position:relative;
}

/* efek grain */
.noise{
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
    radial-gradient(#fff 0.6px, transparent 0.6px);
    background-size:8px 8px;
    pointer-events:none;
}

.container{
    width:100%;
    height:690px; ;
    background:linear-gradient(to bottom, #7A5FC3 50%, #d9c8e8 50%);
    overflow:hidden;
    display:flex;
    position:relative;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* ================= LEFT ================= */

.left-panel{
    width:52%;
    background:linear-gradient(90deg, #A88FD2, #7A5FC3);
    color:white;
    padding:45px;
    border-bottom-right-radius: 60px 140px;
    position:relative;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.hero-text{
    position:absolute;
    left:55px;
    bottom:120px;
    width:420px;
}

.hero-text h1{
    font-size:56px;
    line-height:1.08;
    margin-bottom:18px;
    font-weight:700;
}

.hero-text p{
    font-size:18px;
    color:#ede8ff;
    line-height:1.7;
}

/* ================= RIGHT ================= */

.right-panel{
    width:48%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    border-top-left-radius: 60px 140px;
    background:#d9c8e8;
}


.login-wrapper{ 
    margin: auto;
    width:380px;
    position:relative;
    text-align:center;
}

.purple-top{
    height:120px;
    background: #6d4cc7;
    border-radius:30px 30px 0 0;
    color: white;
    display: block;
    padding-top: 18px;
    justify-items: left;
    padding-left: 16px;

}

.purple-top p{
    font-size:15px;
    color:#ede8ff;
    line-height:1.7;
}

.purple-top h2{
    font-size:24px;
    font-weight:700;
}

.login-card{
    background:#f7f7f7;
    margin-top:-30px;
    border-radius:28px;
    padding:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.login-card h3{
    margin-bottom:20px;
    color:#5b45aa;
}

.login-options{
    display:flex;
    justify-content: center;
    align-items: center;
    margin-top:14px;
}

label{
    display:block;
    text-align:left;
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

input{
    width:100%;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid #d8d8d8;
    margin-bottom:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#7d58d5;
}

.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-58%);
    border:none;
    background:none;
    cursor:pointer;
    color:#777;
}

.password-box img{
    width:20px;
    height:20px;
    opacity:.7;
}

.password-box button:hover img{
    opacity:1;
}

.forgot{
    display:block;
    text-align:left;
    text-decoration:none;
    color:#9078e8;
    font-size:12px;
    margin-bottom:18px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#6d4cc7;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.login-btn:hover{
    background:#5c3db7;
}

.register{
    margin-top:18px;
    font-size:13px;
    color:#555;
}

.register a{
    color:#7c58d4;
    text-decoration:none;
    font-weight:500;
}

.options-btn{
    padding-top: 7px;
    width:48px;
    height:48px;
    border-radius:50%;
    border: none;
    color:#6d4cc7;
    font-size:22px;
    cursor:pointer;
    align-items: center;
    justify-content: center;
    
}

.options-btn img{
    aspect-ratio: 1/1;
    width: 30px;
}



@media (max-width:960px){

    body{
        padding:20px;
        overflow:auto;
    }

    .container{
        width:100%;
        height:auto;
        flex-direction:column;
    }

    .left-panel{
        width:100%;
        border-radius:30px;
        padding-bottom:240px;
    }

    .hero-text{
        width:auto;
        left:40px;
        right:40px;
        bottom:50px;
    }

    .hero-text h1{
        font-size:42px;
    }

    .right-panel{
        width:100%;
        padding:45px 0;
    }


}
</style>

<script>
    const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.src = "img/view.png"
        eyeIcon.alt = "Hide Password"
    }else{
        password.type = "password";
        eyeIcon.src = "img/hide.png"
        eyeIcon.alt = "Show Password"
    }

});

document.querySelector(".login-btn").addEventListener("click", () => {

    const email = document.querySelector("input[type=email]").value;
    const pass = password.value;

    if(email === "" || pass === ""){
        alert("Mohon isi email dan kata sandi.");
        return;
    }

    alert("Login berhasil (dummy).");

});
</script>
