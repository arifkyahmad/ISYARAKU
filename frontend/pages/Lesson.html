<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelajaran | !syaraku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/Lesson.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../../cv-prototype/cv-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="../../cv-prototype/cv-core.js"></script>
  <script src="../js/pages/Lesson.js" defer></script>
</head>
<body>
  <main class="lesson">

    <!-- Progress bar -->
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progres pelajaran">
      <div class="progress__fill" id="progressFill"></div>
    </div>

    <!-- Area sesi: hanya satu .step yang tampil, diatur oleh JS -->
    <section class="stage" id="stage" aria-live="polite">

      <!-- SESI 1: Video materi -->
      <div class="step" data-step="video" hidden>
        <div class="card video-card">
          <p class="video-overlay-title caption" id="videoCaption">Video Isyarat “Halo/Hai”</p>
          <video class="video-card__player" id="lessonVideo" controls preload="metadata" playsinline>
            <source src="../assets/video/Test.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <!-- SESI 2: Praktik (computer vision) -->
      <div class="step" data-step="practice" hidden>
        <div class="card practice-card">
          <div class="practice-card__camera">
            <h2 class="practice-card__title" id="practiceTitle">Sekarang saatnya Kamu mencoba!</h2>
            <video id="cameraFeed" autoplay playsinline muted></video>
            <canvas id="cameraOverlay"></canvas>
            <p class="camera-status" id="cameraStatus">Izinkan akses kamera untuk mencoba isyarat.</p>
            <p class="practice-card__feedback" id="feedback" data-state="idle"></p>
          </div>
        </div>

        <button class="skip-btn" id="skipBtn" type="button">Skip praktek</button>
      </div>

      <!-- SESI 3: Kuis Mencocokkan -->
      <div class="step" data-step="quiz" hidden>
        <div class="card quiz-card">
          <div class="quiz-header">
            <h2 class="quiz-title">Cocokkan Simbol Isyarat!</h2>
            <p class="quiz-subtitle">Klik huruf di sebelah kiri, lalu pilih simbol isyarat yang sesuai di sebelah kanan.</p>
          </div>

          <div class="quiz-match-board">
            <div class="quiz-col" id="quizLettersCol"></div>
            <div class="quiz-col" id="quizSymbolsCol"></div>
          </div>
        </div>
      </div>

    </section>

    <!-- Navigasi -->
    <nav class="nav" aria-label="Navigasi pelajaran">
      <button class="nav__btn" id="backBtn" type="button" aria-label="Kembali">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="nav__btn" id="nextBtn" type="button" aria-label="Lanjut">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </nav>

  </main>

  <!-- Modal Selamat / Level Selesai -->
  <div class="lesson-modal" id="quizSuccessModal" hidden>
    <div class="lesson-modal-card">
      <div class="modal-icon-badge">
        <img src="../assets/img/DoubleHand.svg" alt="" class="modal-theme-icon">
      </div>
      <h2 class="modal-title">Hebat! Semua Cocok!</h2>
      <p class="modal-desc" id="quizSuccessModalDesc">Kamu berhasil mencocokkan semua simbol isyarat dengan sempurna.</p>
      <div class="modal-stars">
        <img src="../assets/img/BintangFilled.svg" alt="Bintang" class="modal-star-img">
        <img src="../assets/img/BintangFilled.svg" alt="Bintang" class="modal-star-img">
        <img src="../assets/img/BintangFilled.svg" alt="Bintang" class="modal-star-img">
      </div>
      <button type="button" class="modal-btn" id="quizModalNextBtn">Lanjut ke Beranda</button>
    </div>
  </div>
</body>
</html>
