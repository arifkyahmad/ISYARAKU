<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Detail Kamus | IsyaraKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/DetailKamus.css">
  <script src="../js/pages/DetailKamus.js" defer></script>
</head>
<body>
  <main class="lesson">
    <header class="lesson-header">
      <a class="lesson-header__back" href="Kamus.html" aria-label="Kembali ke kamus">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progres belajar">
        <div class="progress__fill" id="progressFill"></div>
      </div>
    </header>

    <section class="stage" id="stage" aria-live="polite">
      <div class="step" data-step="video" hidden>
        <div class="card video-card">
          <video class="video-card__player" id="lessonVideo" controls preload="metadata" playsinline>
            <source src="../assets/video/Test.mp4" type="video/mp4">
          </video>
        </div>
        <p class="caption" id="videoCaption">Video Isyarat</p>
      </div>

      <div class="step" data-step="practice" hidden>
        <div class="card practice-card">
          <h1 class="practice-card__title">Sekarang saatnya Kamu mencoba!</h1>
          <div class="practice-card__camera">
            <video id="cameraFeed" autoplay playsinline muted></video>
            <canvas id="cameraOverlay"></canvas>
            <p class="camera-status" id="cameraStatus">Izinkan akses kamera untuk mencoba isyarat.</p>
            <span class="video-card__camera" aria-hidden="true">
              <img src="../assets/img/Camera_Indicator.png" alt="">
            </span>
            <span class="video-card__preview">Preview</span>
          </div>
          <p class="practice-card__feedback" id="feedback" data-state="idle"></p>
        </div>
        <button class="skip-btn" id="skipBtn" type="button">Lewati praktik</button>
      </div>

      <div class="step" data-step="quiz" hidden>
        <div class="card quiz-video">
          <video class="video-card__player" id="quizVideo" controls preload="metadata" playsinline>
            <source src="../assets/video/Test.mp4" type="video/mp4">
          </video>
        </div>
        <h1 class="quiz-question" id="quizQuestion">Isyarat apakah yang ditampilkan?</h1>
        <div class="quiz-options" id="quizOptions"></div>
        <p class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite"></p>
      </div>
    </section>

    <nav class="nav" aria-label="Navigasi belajar">
      <button class="nav__btn nav__btn--back" id="backBtn" type="button" aria-label="Kembali" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button class="nav__btn nav__btn--next" id="nextBtn" type="button">Lanjut</button>
    </nav>
  </main>
</body>
</html>
