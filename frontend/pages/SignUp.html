<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Daftar</title>
  <link rel="stylesheet" href="../assets/css/SignUpDesktop.css">
  <link rel="stylesheet" href="../js/pages/SigUp.js">
</head>
<body>

<div class="noise"></div>

<main class="container">

  <!-- KIRI -->
  <section class="left-panel">
    <h2 class="logo">!syaraku</h2>

    <div class="hero-text">
      <h1>Belajar SIBI,<br>tumbuh bersama.</h1>

      <p>
        Platform belajar inklusif dengan video, praktik kamera pintar,
        dan petualangan yang menyenangkan.
      </p>
    </div>
  </section>

  <!-- KANAN -->
  <section class="right-panel">
    
    <div class="register-wrapper">

      <div class="purple-top">
        <h2>Daftar Akun Baru</h2>
        <p>Mulailah Petualangan belajarmu dengan !syaraku</p>
      </div>

      <div class="register-card">

        <label>Nama Lengkap</label>
        <input type="text" placeholder="@nio@email.com">

        <label>Email</label>
        <input type="email" placeholder="@nio@email.com">

        <label>Kata Sandi</label>

        <div class="password-box">
          <input id="password" type="password" placeholder="••••••••">
          <button id="togglePassword" type="button">
            <img id= "eyeIcon" src="../assets/img/hide.png" alt="ShowPassword ">
          </button>
        </div>

        <p id="passwordMessage" class="message"></p>

        <label for="confirmPassword">Konfirmasi Kata Sandi</label>
        
        <div class="password-box">
            <input id="confirmPassword" type="password" placeholder="Ulangi kata sandi">
            <button type="button" id="toggleConfirmPassword" >
                <img src="../assets/img/hide.png" class="eye-icon" alt="toggle" id="confirmEyeIcon">
            </button>
        </div>

        <div class="terms-checkbox">
            <input type="checkbox" id="agreeTerms">
            <label for="agreeTerms">Saya menyetujui <a href="#">Ketentuan Layanan</a> &amp; <a href="#">Kebijakan Privasi</a></label>
        </div>

        <button class="register-btn" id="registerBtn">Daftar</button>

        <div class="register">
        <br>
        Atau masuk dengan
      </div>

      <div class="register-options">
        <button class="options-btn">
        <img src="../assets/img/search (1).png" alt="">
      </button>
      </div>

      </div>

      

      
      

    </div>

  </section>

</main>


<script src="script.js"></script>
</body>
</html>

<script>
    const eyeIcon = document.getElementById("eyeIcon");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("passwordMessage");
    const registerBtn = document.getElementById("registerBtn");
    const toggle = document.getElementById("togglePassword");
    const confirmEyeIcon = document.getElementById("confirmEyeIcon");
    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
    
    


    toggle.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.src = "../assets/img/view.png"
        eyeIcon.alt = "Hide Password"
    }else{
        password.type = "password";
        eyeIcon.src = "../assets/img/hide.png"
        eyeIcon.alt = "Show Password"
    }

    });

    toggleConfirmPassword.addEventListener("click", () => {

    if(confirmPassword.type === "password"){
        confirmPassword.type = "text";
        confirmEyeIcon.src = "../assets/img/view.png";
        confirmEyeIcon.alt = "Hide Password";
    }else{
        confirmPassword.type = "password";
        confirmEyeIcon.src = "../assets/img/hide.png";
        confirmEyeIcon.alt = "Show Password";
    }

    });



    function validatePassword(){

        if(confirmPassword.value === ""){
            message.textContent = "";
            return false;
        }

        if(password.value === confirmPassword.value){
            message.textContent = " Kata sandi cocok";
            message.classList.add("success");
            return true;
        }else{
            message.textContent = " Kata sandi tidak sama";
            message.classList.remove("success");
            return false;
        }

    }

    password.addEventListener("input", validatePassword);
    confirmPassword.addEventListener("input", validatePassword);

    registerBtn.addEventListener("click", () => {

        const name = document.querySelector('input[type="text"]').value;
        const email = document.querySelector('input[type="email"]').value;

        if(name === "" || email === "" || password.value === "" || confirmPassword.value === ""){
            alert("Semua field wajib diisi.");
            return;
        }

        if(!validatePassword()){
            alert("Konfirmasi kata sandi belum sesuai.");
            return;
        }

        alert("Registrasi berhasil!");

    });

</script>
