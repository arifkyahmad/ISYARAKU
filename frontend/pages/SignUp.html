<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Daftar</title>
  <link rel="stylesheet" href="../css/pages/style.css">
</head>
<body>

<div class="noise"></div>

<main class="container">

  <!-- KIRI -->
  <section class="left-panel">
    <h2 class="logo">!syaraku</h2>

    <div class="hero-text">
      <h1>Belajar BISINDO,<br>tumbuh bersama.</h1>

      <p>
        Platform belajar inklusif dengan video, praktik kamera pintar,
        dan petualangan yang menyenangkan.
      </p>
    </div>
  </section>

  <!-- KANAN -->
  <section class="right-panel">
    
    <div class="register-wrapper">

      <div class="purple-top">
        <h2>Daftar Akun Baru</h2>
        <p>Mulailah Petualangan belajarmu dengan !syaraku</p>
      </div>

      <div class="register-card">

        <label>Nama Lengkap</label>
        <input id="nama" type="text" placeholder="Nama lengkap kamu">

        <label>Email</label>
        <input id="email" type="email" placeholder="@nio@email.com">

        <label>Kata Sandi</label>

        <div class="password-box">
          <input id="password" type="password" placeholder="••••••••">
          <button id="togglePassword" type="button">
            <img id= "eyeIcon" src="img/hide.png" alt="ShowPassword ">
          </button>
        </div>

        <p id="passwordMessage" class="message"></p>

        <label for="confirmPassword">Konfirmasi Kata Sandi</label>
        
        <div class="password-box">
            <input id="confirmPassword" type="password" placeholder="Ulangi kata sandi">
            <button type="button" id="toggleConfirmPassword" >
                <img src="img/hide.png" class="eye-icon" alt="toggle" id="confirmEyeIcon">
            </button>
        </div>

        <a href="#" class="forgot">Lupa Kata Sandi?</a>

        <button class="register-btn" id="registerBtn">Daftar</button>

        

      <div class="register-options">
        <button class="options-btn">
        <img src="img/search (1).png" alt="">
      </button>
      </div>

      </div>

      

      
      

    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
</body>
</html>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background: url(img/9dff1bedbea3a4ccf2cf5f75e10b1dc92ed49932.png);
    background-size: cover;
    position:relative;
}

/* efek grain */
.noise{
    position:absolute;
    inset:0;
    opacity:.18;
    background-image:
    radial-gradient(#fff 0.6px, transparent 0.6px);
    background-size:8px 8px;
    pointer-events:none;
}

.container{
    width:100%;
    height: 690px; 
    background:linear-gradient(to bottom, #7A5FC3 50%, #d9c8e8 50%);
    overflow:hidden;
    display:flex;
    position:relative;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* ================= LEFT ================= */

.left-panel{
    width:52%;
    background:linear-gradient(90deg, #A88FD2, #7A5FC3);
    color:white;
    padding:45px;
    border-bottom-right-radius: 60px 140px;
    position:relative;
}

.logo{
    font-size:28px;
    font-weight:700;
}

.hero-text{
    position:absolute;
    left:55px;
    bottom:120px;
    width:420px;
}

.hero-text h1{
    font-size:56px;
    line-height:1.08;
    margin-bottom:18px;
    font-weight:700;
}

.hero-text p{
    font-size:18px;
    color:#ede8ff;
    line-height:1.7;
}

/* ================= RIGHT ================= */

.right-panel{
    width:48%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    border-top-left-radius: 60px 140px;
    background:#d9c8e8;
}


.register-wrapper{ 
    margin: auto;
    width:380px;
    position:relative;
    text-align:center;
}

.purple-top{
   height:120px;
    background: #6d4cc7;
    border-radius:30px 30px 0 0;
    color: white;
    display: block;
    padding-top: 18px;
    justify-items: left;
    padding-left: 16px;
}

.purple-top p{
    font-size:13px;
    color:#ede8ff;
    line-height:1.7;
}

.purple-top h2{
    font-size:24px;
    font-weight:700;
}

.register-card{
    background:#f7f7f7;
    margin-top:-30px;
    border-radius:28px;
    padding:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}

.register-card h3{
    margin-bottom:20px;
    color:#5b45aa;
}

.register-options{
    display:flex;
    justify-content: center;
    align-items: center;
    margin-top:14px;
}


label{
    display:block;
    text-align:left;
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

input{
    width:100%;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid #d8d8d8;
    margin-bottom:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#7d58d5;
}

.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-58%);
    border:none;
    background:none;
    cursor:pointer;
    color:#777;
}

.password-box img{
    width:20px;
    height:20px;
    opacity:.7;
}

.password-box button:hover img{
    opacity:1;
}

.forgot{
    display:block;
    text-align:left;
    text-decoration:none;
    color:#9078e8;
    font-size:12px;
    margin-bottom:18px;
}

.register-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#6d4cc7;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

.register-btn:hover{
    background:#5c3db7;
}

.message{
    font-size:12px;
    margin:-8px 0 16px;
    text-align:left;
    color:#E53935;
}

.message.success{
    color:#2E7D32;
}

.register{
    margin-top:18px;
    font-size:13px;
    color:#555;
}

.register a{
    color:#7c58d4;
    text-decoration:none;
    font-weight:500;
}

.options-btn{
    padding-top: 7px;
    width:48px;
    height:48px;
    border-radius:50%;
    border-color: none;
    color:#6d4cc7;
    font-size:22px;
    cursor:pointer;
    align-items: center;
    justify-content: center;
    
}

.options-btn img{
    aspect-ratio: 1/1;
    width: 30px;
}



@media (max-width:960px){

    body{
        padding:20px;
        overflow:auto;
    }

    .container{
        width:100%;
        height:auto;
        flex-direction:column;
    }

    .left-panel{
        width:100%;
        border-radius:30px;
        padding-bottom:240px;
    }

    .hero-text{
        width:auto;
        left:40px;
        right:40px;
        bottom:50px;
    }

    .hero-text h1{
        font-size:42px;
    }

    .right-panel{
        width:100%;
        padding:45px 0;
    }


}
</style>

<script>
    const eyeIcon = document.getElementById("eyeIcon");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("passwordMessage");
    const registerBtn = document.getElementById("registerBtn");
    const toggle = document.getElementById("togglePassword");
    const confirmEyeIcon = document.getElementById("confirmEyeIcon");
    const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
    
    


    toggle.addEventListener("click", () => {

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.src = "img/view.png"
        eyeIcon.alt = "Hide Password"
    }else{
        password.type = "password";
        eyeIcon.src = "img/hide.png"
        eyeIcon.alt = "Show Password"
    }

    });

    toggleConfirmPassword.addEventListener("click", () => {

    if(confirmPassword.type === "password"){
        confirmPassword.type = "text";
        confirmEyeIcon.src = "img/view.png";
        confirmEyeIcon.alt = "Hide Password";
    }else{
        confirmPassword.type = "password";
        confirmEyeIcon.src = "img/hide.png";
        confirmEyeIcon.alt = "Show Password";
    }

    });



    function validatePassword(){

        if(confirmPassword.value === ""){
            message.textContent = "";
            return false;
        }

        if(password.value === confirmPassword.value){
            message.textContent = "✓ Kata sandi cocok";
            message.classList.add("success");
            return true;
        }else{
            message.textContent = "✗ Kata sandi tidak sama";
            message.classList.remove("success");
            return false;
        }

    }

    password.addEventListener("input", validatePassword);
    confirmPassword.addEventListener("input", validatePassword);

    registerBtn.addEventListener("click", async () => { 

        const name = document.getElementById("nama").value;
        const email = document.getElementById("email").value;

        if(name === "" || email === "" || password.value === "" || confirmPassword.value === ""){
            alert("Semua field wajib diisi.");
            return;
        }

        if(!validatePassword()){
            alert("Konfirmasi kata sandi belum sesuai.");
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
        email,
        password: password.value,
        options: {
            data: { nama: name }
        }
        });

        if (error) {
        alert(error.message);
        } else {
        alert("Registrasi berhasil!");
        }

    });

</script>
