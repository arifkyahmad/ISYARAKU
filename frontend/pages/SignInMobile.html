
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isyaraku - Login</title>
  <link rel="stylesheet" href="../assets/css/SignInMobile.css">
  <script src="../js/pages/SignInMobile.js" defer></script>
  <!-- Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(
      "ISI_SUPABASE_URL_KAMU",
      "ISI_SUPABASE_ANON_KEY_KAMU"
    );
  </script>
  
</head>
<body>

<div class="noise"></div>

<main class="mobile-container">

  <section class="top-section">
    <h2 class="logo">!syaraku</h2>
    <div class="heading-text">
      <h1>Masuk Ke IsyaraKu</h1>
      <p>Lanjutkan petualangan belajar SIBI-mu</p>
    </div>
  </section>

  <section class="login-card">

    <label>Email</label>
    <input id="email" type="email" placeholder="@nio@email.com">

    <label>Kata Sandi</label>
    <div class="password-box">
      <input id="password" type="password" placeholder="••••••••">
      <button id="togglePassword" type="button">
        <img id="eyeIcon" src="../assets/img/hide.png" alt="Show Password">
      </button>
    </div>

    <a href="#" class="forgot">Lupa Kata Sandi?</a>

    <button class="login-btn">Masuk</button>

    <div class="register">
      Belum punya akun? <a href="SignUpMobile.html">Daftar Sekarang</a>
      <br>
      Atau masuk dengan
    </div>

    <div class="login-options">
      <button id="googleBtn" class="options-btn">
        <img src="../assets/img/search (1).png" alt="Daftar dengan Google">
      </button>
    </div>

  </section>

</main>


</body>
</html>
